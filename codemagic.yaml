workflows:
  # Development workflow with Fastlane - triggers on any branch except main/master
  development:
    name: Development Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
        - pattern: "main"
          include: false
          source: true
        - pattern: "master"
          include: false
          source: true
    environment:
      vars:
        FLUTTER_VERSION: 3.8.0
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      java: 17
      ruby: default
    scripts:
      - name: Install Fastlane
        script: |
          cd ios
          gem install fastlane
      - name: Sync certificates
        script: |
          cd ios
          fastlane sync_certificates
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter analyze
        script: |
          flutter analyze --fatal-infos
      - name: Run Flutter tests
        script: |
          flutter test
      - name: Build iOS (Development) with Fastlane
        script: |
          cd ios
          fastlane build_development
    artifacts:
      - ios/build/*.ipa
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - cschanhniem@gmail.com
        notify:
          success: true
          failure: true

  # Production workflow with Fastlane - triggers on main/master branch
  production:
    name: Production Build & Deploy
    max_build_duration: 90
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
        - pattern: "master"
          include: true
          source: true
    environment:
      vars:
        FLUTTER_VERSION: 3.8.0
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      java: 17
      ruby: default
    scripts:
      - name: Install Fastlane
        script: |
          cd ios
          gem install fastlane
      - name: Generate certificates
        script: |
          cd ios
          fastlane certificates
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter analyze
        script: |
          flutter analyze --fatal-infos
      - name: Run Flutter tests
        script: |
          flutter test
      - name: Build iOS with Fastlane
        script: |
          cd ios
          fastlane build_development
    artifacts:
      - ios/build/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - thhao2003@gmail.com
        notify:
          success: true
          failure: true
