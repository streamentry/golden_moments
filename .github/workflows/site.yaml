name: Website

permissions:
  contents: read

# Pull request runs cancel stale ones. On main a running deploy always
# finishes: a newer push waits behind it (GitHub keeps only the newest
# pending run), so frequent pushes cannot cancel every deploy in turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/site.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/site.yaml"

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up guide translation validator
        run: |
          python3 -m venv "$RUNNER_TEMP/guide-check"
          "$RUNNER_TEMP/guide-check/bin/python" -m pip install --disable-pip-version-check -r scripts/requirements-guide-check.txt
      - name: Check changed English guide translations
        env:
          GUIDE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GUIDE_DIFF_HEAD: ${{ github.sha }}
        run: "$RUNNER_TEMP/guide-check/bin/python" scripts/check-guide-coverage.py --base "$GUIDE_DIFF_BASE" --head "$GUIDE_DIFF_HEAD"
      - name: Test guide translation coverage gate
        run: |
          "$RUNNER_TEMP/guide-check/bin/python" ../tests/test_guide_coverage.py
          "$RUNNER_TEMP/guide-check/bin/python" scripts/test_guide_translation.py
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      # Node is pinned by `devEngines.runtime` in site/package.json; pnpm
      # downloads it into node_modules, so no setup-node step is needed.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm exec vitest run
      - name: Type check
        run: pnpm exec astro sync && pnpm exec tsc --noEmit
      - name: Build
        run: pnpm exec astro build
      - name: Check pages, links, metadata and claims wording
        run: pnpm exec node scripts/check-site.mjs
      - name: Keep the checked build for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist
          retention-days: 1

  # Pushes to main publish the build that the job above just checked, so the
  # live site is always a tested commit. Pull requests never deploy. Needs two
  # repository secrets: CLOUDFLARE_API_TOKEN (a token scoped to Workers
  # Scripts: Edit on this account) and CLOUDFLARE_ACCOUNT_ID. The www redirect
  # Worker (redirect-www/) rarely changes and stays a manual deploy.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://dementiaactivities.games
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Fetch the checked build
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: site/dist
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          packageManager: pnpm
          command: deploy
      - name: Tell IndexNow about the live pages
        # Bing and partners only; Google ignores IndexNow. A failure here must
        # not mark a successful deploy red.
        continue-on-error: true
        run: pnpm exec node scripts/indexnow.mjs
