name: Offline activities and release metadata
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/release_metadata.py --check
  gentle-activities:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/features/gentle_activities --reporter expanded
      - name: Retain resolved dependencies for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-dependencies
          path: pubspec.lock
          retention-days: 7
