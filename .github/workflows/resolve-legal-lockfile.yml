# One-time dependency lockfile resolver for this branch only.
# Remove this workflow before merging the PR.
name: Resolve legal link dependency
on:
  push:
    branches: [feat/app-legal-links-2026]
permissions:
  contents: write
jobs:
  lockfile:
    if: "!contains(github.event.head_commit.message, 'chore: resolve legal URL dependency lockfile')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: resolve legal URL dependency lockfile"
          git push origin HEAD:feat/app-legal-links-2026
