name: golden_moments
description: Golden Moments - A nostalgia-themed, large-print tile-matching game designed for seniors
version: 1.2.0+4
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  audioplayers: ^6.5.1
  bloc: ^9.0.0
  cached_network_image: ^3.3.1
  crypto: ^3.0.5
  disk_space_plus: ^0.2.6
  equatable: ^2.0.5
  firebase_analytics: ^12.0.0
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.4
  percent_indicator: ^4.2.5
  pool: ^1.5.0
  provider: ^6.1.5
  share_plus: ^11.1.0
  shared_preferences: ^2.2.3

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter:
  generate: true
  uses-material-design: true

  # Add assets
  assets:
    - assets/data/
    - assets/sounds/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  android: true
  ios: true
  web: false

  color: "#FFF5DE"
  image: assets/icons/app_icon_padded.png
  color_dark: "#FFF5DE"
  image_dark: assets/icons/app_icon_padded.png

  android_12:
    image: assets/icons/app_icon_padded.png
    color: "#FFF5DE"
    color_dark: "#FFF5DE"
    image_dark: assets/icons/app_icon_padded.png
