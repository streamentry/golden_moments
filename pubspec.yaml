name: golden_moments
description: Golden Moments - A nostalgia-themed, large-print tile-matching game designed for seniors
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  bloc: ^9.0.0
  cached_network_image: ^3.3.1
  crypto: ^3.0.5
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter:
  generate: true
  uses-material-design: true

  # Add assets
  assets:
    - assets/data/

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/icons/app_icon.png'
  min_sdk_android: 21

flutter_native_splash:
  android: true
  ios: true
  web: false

  color: '#FFF5DE'
  image: assets/icons/app_icon_padded.png
  color_dark: '#FFF5DE'
  image_dark: assets/icons/app_icon_padded.png

  android_12:
    image: assets/icons/app_icon_padded.png
    color: '#FFF5DE'
    color_dark: '#FFF5DE'
    image_dark: assets/icons/app_icon_padded.png
