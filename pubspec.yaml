name: golden_moments
description: Gentle shared photo activities with offline starter games and selected family photos.
version: 1.3.0+6
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  audioplayers: ^6.5.0
  bloc: ^9.0.0
  crypto: ^3.0.5
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.4
  intl: ^0.20.2
  path_provider: ^2.1.4
  provider: ^6.1.5
  share_plus: ^13.3.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.3

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
  assets:
    - assets/data/
    - assets/fonts/Roboto_LICENSE.txt
    - assets/images/catalog/
    - assets/sounds/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#FFF5DE"
  image: assets/icons/app_icon_padded.png
  android_12:
    image: assets/icons/app_icon_padded.png
    color: "#FFF5DE"
